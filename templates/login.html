<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="{{ logo }}">
<title>Sign in · {{ COMPANY }}</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<div class="login-wrap"><form class="login" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <img class="logo" src="{{ logo }}" alt="{{ COMPANY }}" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
  <h1 style="display:none">{{ COMPANY }}</h1>
  <p class="muted login-sub">Sign in to your account</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, m in msgs %}<div class="flash {{ cat if cat in ('success','danger') else 'info' }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  <p><label for="u">Username</label><input id="u" type="text" name="username" autocomplete="username" required autofocus></p>
  <p><label for="p">Password</label><input id="p" type="password" name="password" autocomplete="current-password" required></p>
  <p><label style="font-weight:400"><input type="checkbox" name="remember" style="width:auto"> Keep me signed in on this device</label></p>
  <button class="btn" style="width:100%;justify-content:center" type="submit">Sign in</button>
  <p style="text-align:center;margin-bottom:0"><a href="{{ WEBSITE }}">Back to the {{ COMPANY }} website</a></p>
</form></div></body></html>
